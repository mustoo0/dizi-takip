<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dizi Takip</title>
<meta name="theme-color" content="#090d16">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(circle at top left,#1e1b4b,#090d16 55%,#05070c 100%);background-attachment:fixed;color:#f8fafc;padding:16px;max-width:540px;margin:0 auto;padding-bottom:80px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:rgba(255,255,255,.06);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14);border-radius:18px;margin-bottom:20px}
h1{font-size:19px;font-weight:700}
.status{font-size:11.5px;font-weight:600;color:#4ade80;background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.3);padding:5px 11px;border-radius:20px}
.status.err{color:#f87171;background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.3)}
.card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 10px 35px rgba(0,0,0,.45)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.show-title{font-size:20px;font-weight:700;color:#fff}
.del-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#94a3b8;width:32px;height:32px;border-radius:10px;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 6px;text-align:center}
.stat-lbl{font-size:11px;color:#94a3b8;font-weight:600}
.stat-val{font-size:21px;font-weight:700;margin-top:3px;color:#38bdf8}
.min-val{color:#c084fc}
.btn-watch{width:100%;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-size:15px;padding:14px;display:flex;justify-content:center;align-items:center;text-decoration:none;border-radius:14px;font-weight:600;margin-bottom:14px;border:1px solid rgba(255,255,255,.2)}
.min-box{background:rgba(147,51,234,.15);border:1px solid rgba(192,132,252,.4);padding:12px 14px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.min-box span{font-size:13.5px;color:#f3e8ff;font-weight:600}
.min-act{display:flex;align-items:center;gap:8px}
.min-act input{width:72px;background:rgba(0,0,0,.5);border:1px solid rgba(192,132,252,.5);color:#fff;padding:9px;border-radius:10px;text-align:center;font-size:15px;font-weight:700}
.btn-min{background:#9333ea;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;border:none;font-weight:600;cursor:pointer}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:none;border-radius:13px;padding:12px;font-size:13.5px;font-weight:600;cursor:pointer}
.btn-pri{background:rgba(56,189,248,.2);color:#7dd3fc;border:1px solid rgba(56,189,248,.4)}
.btn-sec{background:rgba(255,255,255,.08);color:#e2e8f0;border:1px solid rgba(255,255,255,.12)}
.add-card{background:rgba(255,255,255,.05);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:20px;margin-top:24px}
.add-title{font-size:16px;font-weight:700;margin-bottom:14px}
.inp-grp{display:flex;flex-direction:column;gap:12px}
.lbl{display:block;font-size:12px;color:#94a3b8;margin-bottom:5px;font-weight:600}
input{width:100%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);color:#fff;padding:12px;border-radius:12px;font-size:14px;outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-add{background:linear-gradient(135deg,#0ea5e9,#2563eb);color:#fff;padding:14px;font-size:14.5px;margin-top:4px}
</style>
</head>
<body>
<header><h1>🎬 Dizi Takip</h1><span class="status" id="st">Bağlanıyor...</span></header>
<div id="list"></div>
<div class="add-card">
<div class="add-title">+ Yeni Dizi Ekle</div>
<div class="inp-grp">
<div><span class="lbl">Dizi Adı</span><input type="text" id="nName" placeholder="Örn: Dexter, Sıfır Bir..."></div>
<div><span class="lbl">İzlediğin Site Linki</span><input type="url" id="nUrl" placeholder="https://filmmakinesi.to..."></div>
<div class="row2">
<div><span class="lbl">Sezon Seç</span><input type="number" id="nSea" min="1" value="1"></div>
<div><span class="lbl">Bölüm Seç</span><input type="number" id="nEpi" min="1" value="1"></div>
</div>
<button class="btn-add" onclick="add()">Listeye Ekle</button>
</div>
</div>
<script>
const DB="https://firebaseio.com";
let db={mentalist:{name:"The Mentalist",url:"https://filmmakinesi.todizi/the-mentalist-izle-2008-fmvcyy/",season:1,episode:2,minute:0}};
function draw(){
const c=document.getElementById("list");c.innerHTML="";
Object.keys(db).forEach(k=>{
const s=db[k];
c.innerHTML+='<div class="card"><div class="card-header"><div class="show-title">'+s.name+'</div><button class="del-btn" onclick="del(\''+k+'\')">✕</button></div><div class="stats"><div class="stat-box"><div class="stat-lbl">SEZON</div><div class="stat-val">'+s.season+'</div></div><div class="stat-box"><div class="stat-lbl">BÖLÜM</div><div class="stat-val">'+s.episode+'</div></div><div class="stat-box"><div class="stat-lbl">DAKİKA</div><div class="stat-val min-val">'+(s.minute||0)+' dk</div></div></div><a href="'+s.url+'" target="_blank" class="btn-watch">▶ İzlemeye Git ('+s.season+'. Sezon '+s.episode+'. Bölüm)</a><div class="min-box"><span>⏱ Kaldığın Dakika:</span><div class="min-act"><input type="number" id="m-'+k+'" value="'+(s.minute||0)+'" min="0"><button class="btn-min" onclick="sMin(\''+k+'\')">Dk Kaydet</button></div></div><div class="controls"><button class="btn-pri" onclick="cEpi(\''+k+'\',1)">✓ Bölüm +1</button><button class="btn-sec" onclick="cSea(\''+k+'\',1)">Yeni Sezon +1</button><button class="btn-sec" onclick="cEpi(\''+k+'\',-1)">Bölüm -1</button><button class="btn-sec" onclick="cSea(\''+k+'\',-1)">Sezon -1</button></div></div>';
});
}
function sync(push){
const st=document.getElementById("st");
const x=new XMLHttpRequest();
x.open(push?"PUT":"GET",DB+"?t="+Date.now(),true);
x.timeout=6000;
x.onload=function(){
if(x.status>=200&&x.status<300){
if(!push){
const d=JSON.parse(x.responseText);
if(d&&Object.keys(d).length>0)db=d;else sync(true);
}
st.className="status";st.innerText="● Canlı Senkronize";
draw();
}else{
st.className="status err";st.innerText="Hata Kodu: "+x.status;
}
};
x.onerror=function(){st.className="status err";st.innerText="Ağ/DPI Engeli";};
x.ontimeout=function(){st.className="status err";st.innerText="Zaman Aşımı";};
x.send(push?JSON.stringify(db):null);
}
function cEpi(k,d){db[k].episode=Math.max(1,(db[k].episode||1)+d);db[k].minute=0;draw();sync(true);}
function cSea(k,d){db[k].season=Math.max(1,(db[k].season||1)+d);if(d>0)db[k].episode=1;db[k].minute=0;draw();sync(true);}
function sMin(k){db[k].minute=Math.max(0,parseInt(document.getElementById("m-"+k).value)||0);draw();sync(true);}
function add(){
const n=document.getElementById("nName").value.trim();if(!n)return alert("Dizi adı yaz!");
db["s_"+Date.now()]={name:n,url:document.getElementById("nUrl").value.trim()||"https://filmmakinesi.to",season:parseInt(document.getElementById("nSea").value)||1,episode:parseInt(document.getElementById("nEpi").value)||1,minute:0};
document.getElementById("nName").value="";document.getElementById("nUrl").value="";draw();sync(true);
}
function del(k){if(confirm(db[k].name+" silinsin mi?")){delete db[k];draw();sync(true);}}
draw();sync(false);setInterval(()=>sync(false),7000);
</script>
</body>
</html>
